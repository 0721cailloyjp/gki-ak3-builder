name: Build GKI Kernel + AnyKernel3

# 手动触发，一次只编一个 KMI / 一个 root 方案，避免大批量 CI 与风控。
on:
  workflow_dispatch:
    inputs:
      root_solution:
        description: "root 方案（KSU 系列，均为正式主流项目）"
        required: true
        type: choice
        default: moesu
        options:
          # 与 config/root-solutions.json 的 solutions[].id 一一对应
          - moesu
          - kernelsu
          - sukisu
          - kernelsu-next
      kmi:
        description: "目标 KMI"
        required: true
        type: choice
        default: android15-6.6
        options:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
      kernel_branch:
        description: "AOSP kernel/common 分支（默认用 lts；也可填 android15-6.6-2026-10 这类月度分支）"
        required: false
        type: string
        default: ""
      solution_ref:
        description: "root 源码引用（分支/tag/commit，留空=用配置里的默认分支）"
        required: false
        type: string
        default: ""
      enable_susfs:
        description: "集成 SUSFS 内核补丁"
        required: true
        type: boolean
        default: true
      skip_on_patch_failure:
        description: "补丁失败时跳过而不中断构建"
        required: true
        type: boolean
        default: true
      make_release:
        description: "构建成功后创建 Release"
        required: true
        type: boolean
        default: true
      release_tag:
        description: "Release tag（留空=自动生成）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  AK3_REPO: "https://github.com/WildKernels/AnyKernel3.git"
  AK3_BRANCH: "gki-2.0"
  SUSFS_REPO: "https://github.com/ShirkNeko/susfs4ksu.git"
  KERNEL_COMMON: "https://android.googlesource.com/kernel/common"
  SOLUTION_CONFIG: "config/root-solutions.json"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出本仓库（读取方案配置）
        uses: actions/checkout@v4

      # 把「多方案差异」从 workflow 里抽干净：repo / 默认分支 / Manager 来源 /
      # 包名白名单 / 版本算法全部来自 config/root-solutions.json。
      # 注意：本步骤不能读取自己的 outputs（GitHub 语义），校验放到下一步。
      - name: 解析 root 方案配置
        id: sol
        env:
          ROOT_SOLUTION: ${{ inputs.root_solution }}
        run: |
          chmod +x scripts/resolve-solution.sh
          bash scripts/resolve-solution.sh
          echo "--- 方案摘要 ---"
          echo "方案        : ${{ inputs.root_solution }}"
          cat "$SOLUTION_CONFIG"

      # 硬断言：解析必须真的产出输出。漏写 $GITHUB_OUTPUT 会让下游拿到空字符串，
      # 表现为 shell 报 "The empty string is not a valid path" 这种难查的错误。
      - name: 校验方案输出
        run: |
          SOL_NAME="${{ steps.sol.outputs.sol_name }}"
          SOL_REPO="${{ steps.sol.outputs.sol_repo }}"
          SOL_REF="${{ steps.sol.outputs.sol_ref }}"
          SOL_GIT="${{ steps.sol.outputs.sol_needs_git }}"
          SOL_FORMULA="${{ steps.sol.outputs.sol_version_formula }}"
          MGR_REPO="${{ steps.sol.outputs.mgr_repo }}"
          MGR_PKGS="${{ steps.sol.outputs.mgr_pkgs }}"

          printf '%-16s = %s\n' \
            sol_name "$SOL_NAME" \
            sol_repo "$SOL_REPO" \
            sol_ref "$SOL_REF" \
            sol_needs_git "$SOL_GIT" \
            sol_version_formula "$SOL_FORMULA" \
            mgr_repo "$MGR_REPO" \
            mgr_pkgs "$MGR_PKGS"

          [ -n "$SOL_NAME" ] || { echo "::error::sol_name 为空：resolve-solution.sh 未写入 GITHUB_OUTPUT"; exit 1; }
          [ -n "$SOL_REPO" ] || { echo "::error::sol_repo 为空：resolve-solution.sh 未写入 GITHUB_OUTPUT"; exit 1; }
          [ -n "$SOL_REF" ]  || { echo "::error::sol_ref 为空：resolve-solution.sh 未写入 GITHUB_OUTPUT"; exit 1; }
          case "$SOL_GIT" in true|false) ;; *) echo "::error::sol_needs_git 非法: '$SOL_GIT'"; exit 1 ;; esac
          echo "OK: 方案输出已就绪（$SOL_NAME）"

      - name: 输出构建参数
        run: |
          echo "root 方案     : ${{ inputs.root_solution }}"
          echo "KMI           : ${{ inputs.kmi }}"
          echo "kernel branch : ${{ inputs.kernel_branch || '(auto -> lts)' }}"
          echo "solution ref  : ${{ inputs.solution_ref || '(配置默认)' }}"
          echo "SUSFS         : ${{ inputs.enable_susfs }}"
          echo "skip on fail  : ${{ inputs.skip_on_patch_failure }}"

      - name: 解析 KMI 参数
        id: kmi
        run: |
          KMI="${{ inputs.kmi }}"
          KV="${KMI##*-}"            # 6.6
          AV="${KMI%%-*}"            # android15
          BRANCH="${{ inputs.kernel_branch }}"
          [ -n "$BRANCH" ] || BRANCH="${KMI}-lts"
          echo "kmi=$KMI"        >> $GITHUB_OUTPUT
          echo "kv=$KV"          >> $GITHUB_OUTPUT
          echo "av=$AV"          >> $GITHUB_OUTPUT
          echo "branch=$BRANCH"  >> $GITHUB_OUTPUT
          echo "resolved: KMI=$KMI KV=$KV AV=$AV BRANCH=$BRANCH"

      # GKI 内核必须用 Clang/LLVM 编译（make ... LLVM=1），且 AOSP 对版本有要求。
      # 关键点：ld.lld / llvm-ar / llvm-objcopy 等必须齐全，否则 kconfig 阶段就报
      #   scripts/Kconfig.include:41: linker 'ld.lld' not found
      # 这里装 Ubuntu 自带的 clang/lld（版本随 runner 升级，经验上 ubuntu-24.04 的
      # clang-18 足够编 5.10~6.12）。同时装 ccache 加速后续重复构建。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget zip unzip python3 bc bison flex \
            libssl-dev libelf-dev cpio kmod rsync ccache \
            clang lld llvm libclang-dev

          echo "=== 工具链版本 ==="
          clang --version | head -2
          ld.lld --version
          llvm-ar --version | head -1
          which clang ld.lld llvm-ar llvm-objcopy llvm-strip
          echo "CLANG_VERSION=$(clang -dumpversion | cut -d. -f1)" >> "$GITHUB_ENV"

      # 5.10 / 5.15 等较老的 KMI 对过新的 clang 可能不兼容（新版编译器默认更严格，
      # 老内核会踩 -Werror 或 inline asm 约束问题）。这里按 KMI 决定是否降级到
      # clang-14/15。默认保持系统版本，仅在老 KMI 上尝试降级；失败不致命，
      # 因为后续编译步骤才是最终裁判。
      - name: 按 KMI 选择工具链版本
        continue-on-error: true
        env:
          KV: ${{ steps.kmi.outputs.kv }}
        run: |
          echo "目标内核: $KV ；当前 clang: ${CLANG_VERSION:-?}"
          case "$KV" in
            5.10|5.15)
              echo "==> 老 KMI，尝试安装 clang-14（更保守）"
              if sudo apt-get install -y --no-install-recommends clang-14 lld-14 2>/dev/null; then
                echo "OK: clang-14 已安装，切换 LLVM 前缀为 -14 变体"
                {
                  echo "LLVM_SUFFIX=-14"
                } >> "$GITHUB_ENV"
                clang-14 --version | head -1
              else
                echo "::warning::clang-14 安装失败，沿用系统 clang"
              fi
              ;;
            *)
              echo "==> 较新 KMI，沿用系统 clang-${CLANG_VERSION:-?} 即可"
              ;;
          esac

          # 统一算出 make 的 LLVM 参数：
          #  - 默认 LLVM=1（让 Makefile 自动找 clang/ld.lld/llvm-* 该系列工具）
          #  - 若降级到 clang-14，则显式给全套 -14 二进制，避免混用系统新版
          if [ "${LLVM_SUFFIX:-}" = "-14" ]; then
            echo "LLVM_MAKE_ARGS=LLVM=1 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 READELF=llvm-readelf-14 STRIP=llvm-strip-14" >> "$GITHUB_ENV"
          else
            echo "LLVM_MAKE_ARGS=LLVM=1" >> "$GITHUB_ENV"
          fi
          echo "LLVM_MAKE_ARGS 将用于所有 make 调用"

      - name: 拉取 AOSP GKI 内核源码
        run: |
          BRANCH="${{ steps.kmi.outputs.branch }}"
          echo "==> clone kernel/common @ $BRANCH (depth=1)"
          git clone --depth=1 --branch "$BRANCH" "$KERNEL_COMMON" gki
          cd gki
          echo "HEAD: $(git rev-parse HEAD)"
          echo "$(git log -1 --format='%cd %s' --date=short)" > ../GKI_INFO.txt
          cat ../GKI_INFO.txt

      # KSU 系列的 kernel/Kbuild 里 KSU_VERSION 大多形如
      #   30000 + $(git rev-list --count HEAD)
      # 浅克隆会让 commit 计数退化成 1 → 版本号错误 → 管理器提示"需要更新内核"。
      # 因此默认必须做完整克隆；只有支持 GITHUB_COMMITS 环境变量覆盖的方案
      # （目前是 SukiSU-Ultra）才允许浅克隆。
      - name: 拉取 root 方案内核源码
        env:
          NEEDS_GIT: ${{ steps.sol.outputs.sol_needs_git }}
          SOL_REPO: ${{ steps.sol.outputs.sol_repo }}
          DEFAULT_REF: ${{ steps.sol.outputs.sol_ref }}
        run: |
          REF="${{ inputs.solution_ref }}"
          [ -n "$REF" ] || REF="$DEFAULT_REF"
          echo "==> 方案: ${{ steps.sol.outputs.sol_name }}  仓库: $SOL_REPO  引用: $REF"
          # 空值保护：空字符串会让 git 报 "The empty string is not a valid path"
          [ -n "$SOL_REPO" ] || { echo "::error::SOL_REPO 为空"; exit 1; }
          [ -n "$REF" ]      || { echo "::error::REF 为空"; exit 1; }
          if [ "$NEEDS_GIT" = "true" ]; then
            echo "==> clone $SOL_REPO @ $REF（完整历史，供 Kbuild 统计版本号）"
            git clone --branch "$REF" "$SOL_REPO" ksu-src
          else
            echo "==> clone $SOL_REPO @ $REF（浅克隆：该方案支持 GITHUB_COMMITS 覆盖）"
            git clone --depth=1 --branch "$REF" "$SOL_REPO" ksu-src
          fi
          cd ksu-src
          KSU_COMMITS="$(git rev-list --count HEAD)"
          echo "HEAD: $(git rev-parse HEAD)"
          echo "commit count: $KSU_COMMITS"
          {
            echo "solution: ${{ steps.sol.outputs.sol_id }} (${{ steps.sol.outputs.sol_name }})"
            echo "ref: $REF"
            echo "HEAD: $(git rev-parse HEAD)"
            echo "commit_count: $KSU_COMMITS"
            echo "version_formula: ${{ steps.sol.outputs.sol_version_formula }}"
          } > ../KSU_INFO.txt
          cat ../KSU_INFO.txt

      # KSU 系列的 kernel/setup.sh 是标准 KernelSU 集成脚本，但它内部执行
      # git clone/stash/checkout/pull（会去拉 tiann/KernelSU），对"已克隆的本地源码"
      # 不可靠，而且没必要——源码的 kernel/ 本身已是自包含的完整内核侧树。
      #
      # 这里手工集成，关键点：
      #   * 整个源码仓库（含 .git）放进内核树，否则 kernel/Kbuild 的
      #     `git rev-parse --show-toplevel` 会向上命中 gki/.git，判定为"与内核同一个仓库"，
      #     从而跳过版本推导，KSU_VERSION 退化成 16，管理器会提示"需要更新内核"。
      #   * 软链 kernelsu -> ksu-src/kernel，保持 -I$(KSU_KERNEL_DIR) 等路径正确。
      #
      # 四家（MoeSU / KernelSU / SukiSU-Ultra / KernelSU-Next）的 kernel/ 目录结构
      # 与 Kconfig 里 `config KSU` 定义完全一致，所以这段逻辑可以共用。
      - name: 集成 root 方案内核（built-in 模式）
        working-directory: gki
        run: |
          # 1) 找到内核的 drivers 目录
          if [ -d common/drivers ]; then
            DRIVER_DIR=common/drivers
          elif [ -d drivers ]; then
            DRIVER_DIR=drivers
          else
            echo "::error::找不到 drivers/ 或 common/drivers/ 目录"; exit 1
          fi
          echo "DRIVER_DIR=$DRIVER_DIR"

          # 2) 放入完整的源码仓库副本（保留 .git，供 Kbuild 推导 KSU_VERSION）
          rm -rf "$DRIVER_DIR/kernelsu" "$DRIVER_DIR/ksu-src"
          mkdir -p "$DRIVER_DIR/ksu-src"
          cp -a ../ksu-src/. "$DRIVER_DIR/ksu-src/"
          test -d "$DRIVER_DIR/ksu-src/.git" \
            || echo "::warning::ksu-src 里没有 .git，KSU_VERSION 可能退化"

          # 3) 软链 kernelsu -> ksu-src/kernel（相对路径，避免绝对路径污染）
          ln -s ksu-src/kernel "$DRIVER_DIR/kernelsu"
          ls -la "$DRIVER_DIR" | grep -i -E "kernelsu|ksu-src"

          # 硬断言：软链必须真的指向源码树，否则后续编译会静默失败
          [ -L "$DRIVER_DIR/kernelsu" ] \
            || { echo "::error::$DRIVER_DIR/kernelsu 不是符号链接"; exit 1; }
          [ -e "$DRIVER_DIR/kernelsu/Kbuild" ] \
            || { echo "::error::$DRIVER_DIR/kernelsu/Kbuild 不可达，软链未生效"; exit 1; }

          # 4) 往 Makefile 追加编译条目
          grep -q "kernelsu" "$DRIVER_DIR/Makefile" \
            || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$DRIVER_DIR/Makefile"
          grep -n "kernelsu" "$DRIVER_DIR/Makefile"

          # 5) 往 Kconfig 追加 source 行
          grep -q 'drivers/kernelsu/Kconfig' "$DRIVER_DIR/Kconfig" \
            || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' "$DRIVER_DIR/Kconfig"
          grep -n "kernelsu" "$DRIVER_DIR/Kconfig"

          echo "--- 校验 ---"
          test -e "$DRIVER_DIR/kernelsu/Kbuild" && echo "OK: Kbuild 存在"
          test -e "$DRIVER_DIR/kernelsu/Kconfig" && echo "OK: Kconfig 存在"

      - name: 应用 SUSFS 补丁
        if: ${{ inputs.enable_susfs && steps.sol.outputs.sol_susfs_compatible == 'true' }}
        working-directory: gki
        continue-on-error: ${{ inputs.skip_on_patch_failure }}
        run: |
          SUSFS_BRANCH="gki-${{ steps.kmi.outputs.av }}-${{ steps.kmi.outputs.kv }}"
          echo "==> clone susfs4ksu @ $SUSFS_BRANCH"
          if ! git clone --depth=1 --branch "$SUSFS_BRANCH" "$SUSFS_REPO" /tmp/susfs4ksu; then
            echo "::warning::susfs4ksu 无 $SUSFS_BRANCH 分支，跳过 SUSFS"
            exit 0
          fi
          PATCH="/tmp/susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch"
          if [ ! -f "$PATCH" ]; then
            echo "::warning::找不到补丁 $PATCH，跳过 SUSFS"
            exit 0
          fi
          echo "==> [1/2] 应用内核侧补丁 $PATCH"
          patch -p1 --forward < "$PATCH"

          echo "==> 复制 susfs 头文件与源到内核树"
          if [ -d /tmp/susfs4ksu/kernel_patches/fs ]; then
            cp -v /tmp/susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          fi
          if [ -d /tmp/susfs4ksu/kernel_patches/include/linux ]; then
            cp -v /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
          fi

          echo "==> [2/2] 应用 KSU 侧补丁"
          KSU_PATCH="/tmp/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KSU_PATCH" ]; then
            # KSU 源码经软链到 drivers/kernelsu，补丁以 KernelSU/ 为根，
            # 因此用 -d 指向软链目标目录并剥掉一层前缀。
            KSU_DIR="$(readlink -f drivers/kernelsu)"
            echo "KSU dir -> $KSU_DIR"
            if patch -p1 --forward -d "$KSU_DIR" < "$KSU_PATCH"; then
              echo "OK: KSU 侧 SUSFS 补丁已应用"
            else
              echo "::warning::KSU 侧 SUSFS 补丁未完全应用（上游源码结构可能与官方 KernelSU 不同）"
            fi
          else
            echo "::warning::未找到 $KSU_PATCH，仅应用内核侧 SUSFS"
          fi
          echo "SUSFS applied (kernel side)."

      - name: 配置内核（CONFIG_KSU=y）
        working-directory: gki
        run: |
          echo "==> gki_defconfig"
          make ARCH=arm64 $LLVM_MAKE_ARGS gki_defconfig

          # GKI 默认开 LTO（THINLTO/FULL），会显著拖长编译并易 OOM；关掉。
          scripts/config --file .config -d LTO_CLANG -e LTO_NONE \
            -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO || true

          # --- KSU 系列必需项 ---
          # Kconfig: config KSU depends on KPROBES && EXT4_FS，default y
          scripts/config --file .config -e KSU
          scripts/config --file .config -e KSU_DYNAMIC_MANAGER
          # 依赖：KPROBES + EXT4_FS
          scripts/config --file .config -e KPROBES
          scripts/config --file .config -e KPROBES_EVENTS || true
          scripts/config --file .config -e EXT4_FS

          # --- 故意不定义 KSU_MANAGER_PACKAGE ---
          # kernel/manager/apk_sign.c 的 is_manager_apk() 逻辑是：
          #   #ifdef KSU_MANAGER_PACKAGE  →  先比对包名，不等就直接 false
          #   然后才比对签名
          # 即「包名校验」与「签名校验」是 AND 关系。
          #
          # 上游已确定把 Manager 包名从 me.yuki.folksu 改为 me.yuki.moe / moesu
          # （签名证书不变）。若这里固化了包名，改名后内核将不再识别新 Manager。
          # 因此保持不定义，让内核只按签名信任 —— 签名不变则跨版本始终可用。
          # 如需手动指定，用 make 命令行传：KSU_MANAGER_PACKAGE=<包名>
          echo "==> 确认未固化 Manager 包名（只按签名信任）"
          grep -q "KSU_MANAGER_PACKAGE" .config 2>/dev/null \
            && echo "::warning::检测到 KSU_MANAGER_PACKAGE，改名后可能失效" \
            || echo "OK: 未固化包名"

          # --- SUSFS（若补丁已应用，这些符号才存在）---
          for sym in KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT \
                     KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME \
                     KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS; do
            scripts/config --file .config -e "$sym" 2>/dev/null || true
          done

          # 内核侧符号解析
          scripts/config --file .config -e KALLSYMS -e KALLSYMS_ALL || true

          echo "==> olddefconfig 归一化"
          make ARCH=arm64 $LLVM_MAKE_ARGS olddefconfig

          echo "==> 最终关键配置"
          grep -E "^CONFIG_(KSU|KPROBES|EXT4_FS|LTO)" .config || true
          echo "--- 断言 CONFIG_KSU 生效 ---"
          grep -qE '^CONFIG_KSU=y' .config || grep -qE '^CONFIG_KSU=m' .config \
            || { echo "::error::CONFIG_KSU 未生效，集成失败"; exit 1; }

      - name: 编译内核
        working-directory: gki
        run: |
          echo "==> 开始编译（预计 40-150 分钟）"
          nproc
          make ARCH=arm64 $LLVM_MAKE_ARGS -j"$(nproc)" Image
          echo "==> 编译完成"
          ls -la arch/arm64/boot/Image
          du -h arch/arm64/boot/Image

      - name: 校验内核内含 KSU
        working-directory: gki
        run: |
          strings arch/arm64/boot/Image | grep -m3 -iE "kernelsu|KSU" || echo "note: 未在 Image 中直接匹配到 ksu 字符串（可能被压缩），继续"
          echo "kernel release: $(make ARCH=arm64 $LLVM_MAKE_ARGS -s kernelrelease)"

      - name: 准备 AK3 打包目录
        run: |
          echo "==> clone AK3 @ $AK3_BRANCH"
          git clone --depth=1 --branch "$AK3_BRANCH" "$AK3_REPO" ak3
          rm -rf ak3/.git
          echo "--- AK3 内容 ---"
          ls -la ak3/
          echo "--- marker 校验（标准 AK3 要求恰好 1 个）---"
          grep -c "chmod -R 755 tools bin;" ak3/META-INF/com/google/android/update-binary

      # ---------------------------------------------------------------------
      # anykernel.sh：GKI 内核刷机脚本
      #
      # 两块重点：
      #  A. 防格机（anti-brick）—— 宁可刷不进去，也不能刷错变砖
      #     1) 设备 GKI 内核主版本必须与包内内核严格一致（5.10/5.15/6.1/6.6/6.12）
      #     2) 校验 boot/init_boot 分区存在且可读
      #     3) 校验设备是 64 位 arm64（v8a）
      #     4) 任一不符 → abort，绝不继续写分区
      #
      #  B. 一加 / OPPO 兼容
      #     * 13+ 一加/OPPO 常见 ramdisk 落在 init_boot 而非 boot → 自动探测
      #     * 有些机型是 boot 与 init_boot 分离（A/B + 独立 init_boot）
      #     * OPPO/一加 `avb` 校验严格 → patch_vbmeta_flag 需按机型处理
      #     * 部分一加机型 ramdisk 为空（vendor_boot 承载）→ 需降级为整刷
      # ---------------------------------------------------------------------
      - name: 写入 GKI 版 anykernel.sh
        env:
          KMI_NAME: ${{ steps.kmi.outputs.kmi }}
          KMI_VER: ${{ steps.kmi.outputs.kv }}
          SOL_NAME: ${{ steps.sol.outputs.sol_name }}
        run: |
          python3 - <<'PYEOF'
          import os

          kmi = os.environ["KMI_NAME"]
          kv = os.environ["KMI_VER"]
          sol = os.environ["SOL_NAME"]

          tpl = r'''### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers | {{SOL}} GKI build
          ## 目标 KMI: {{KMI}}  (kernel {{KV}}.x)

          properties() { '
          kernel.string={{SOL}} {{KMI}} GKI Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          do.check_boot_version=1
          do.vbmeta_check=1
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          keycheck.timeout=10
          '; }

          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          # ==================== 目标内核版本 ====================
          TARGET_KV="{{KV}}"

          . tools/ak3-core.sh;

          # ==================== A. 防格机保护 ====================
          # 说明：本区块只做"检查 + abort"，不写任何分区。
          #       设计原则：宁可刷不进去，也绝不刷错变砖。

          # A1) 设备架构必须是 arm64（v8a）
          ARCH="$(getprop ro.product.cpu.abi 2>/dev/null)"
          case "$ARCH" in
            arm64*|aarch64*) ;;
            *) abort "  设备架构为 '$ARCH'，本包仅支持 arm64（v8a），已中止。" ;;
          esac
          ui_print " " "  [防格机] 架构: $ARCH  OK"

          # A2) 设备内核主版本必须与包内内核一致
          #     取主版本号为 5.10 / 5.15 / 6.1 / 6.6 / 6.12 这类
          DEV_KERNEL="$(cat /proc/version 2>/dev/null | awk -F '-' '{print $1}' | awk '{print $3}')"
          DEV_MAJMIN="$(echo "$DEV_KERNEL" | awk -F '.' '{print $1"."$2}')"
          case "$DEV_MAJMIN" in
            5.10|5.15|6.1|6.6|6.12|6.1x) ;;
            *) abort "  设备内核 $DEV_MAJMIN 非受支持的 GKI 主线，已中止。" ;;
          esac
          ui_print " " "  [防格机] 设备内核: $DEV_MAJMIN  包内内核: $TARGET_KV"

          if [ "$DEV_MAJMIN" != "$TARGET_KV" ]; then
            abort "  内核主版本不匹配！设备 $DEV_MAJMIN ≠ 本包 $TARGET_KV。跨 KMI 强刷会导致无法开机，已中止。"
          fi
          ui_print " " "  [防格机] 内核版本一致  OK"

          # A3) 分区可读性检查（boot / init_boot 至少一个可用）
          SLOT="$(getprop ro.boot.slot_suffix 2>/dev/null)"
          BOOT_PART="/dev/block/by-name/boot${SLOT}"
          INITBOOT_PART="/dev/block/by-name/init_boot${SLOT}"
          [ -e "$BOOT_PART" ] || BOOT_PART="/dev/block/bootdevice/by-name/boot${SLOT}"
          [ -e "$INITBOOT_PART" ] || INITBOOT_PART="/dev/block/bootdevice/by-name/init_boot${SLOT}"

          if [ ! -e "$BOOT_PART" ] && [ ! -e "$INITBOOT_PART" ]; then
            abort "  找不到 boot 或 init_boot 分区，设备结构不受支持，已中止。"
          fi
          ui_print " " "  [防格机] boot=$([ -e "$BOOT_PART" ] && echo 有 || echo 无)  init_boot=$([ -e "$INITBOOT_PART" ] && echo 有 || echo 无)"

          # 保留 AK3 自带的版本校验作为第二道闸
          do_check_boot_version;

          # ==================== B. 一加 / OPPO 兼容 ====================
          # 一加(OnePlus) / OPPO(含 realme) 在 Android 13+ 上常见的坑：
          #   * ramdisk 从 boot 搬到 init_boot（独立分区）
          #   * 部分机型 boot 内 ramdisk 为空，实际内核仍要写 boot
          #   * OPPO/一加 avb 校验严格，需保留 vbmeta 处理
          # 这里做运行时分流，不改 AK3 本体行为。

          IS_OPLUS=false
          BRAND="$(getprop ro.product.brand 2>/dev/null)"
          MANU="$(getprop ro.product.manufacturer 2>/dev/null)"
          OPLUS_PROP="$(getprop ro.separate.soft 2>/dev/null)"
          PRODUCT_DEVICE="$(getprop ro.product.device 2>/dev/null)"

          case "$BRAND$MANU$OPLUS_PROP" in
            *OnePlus*|*oneplus*|*OPPO*|*oppo*|*realme*|*oplus*) IS_OPLUS=true ;;
          esac
          # 一加/OPPO 常带 oplus 专有属性，也作为判定依据
          [ -n "$OPLUS_PROP" ] && IS_OPLUS=true

          if [ "$IS_OPLUS" = true ]; then
            ui_print " " "  [一加/OPPO] 检测到品牌: ${BRAND:-?} / ${MANU:-?}  机型: ${PRODUCT_DEVICE:-?}"
            # 一加/OPPO 若存在独立 init_boot，则 ramdisk 通常在那里
            if [ -e "$INITBOOT_PART" ]; then
              ui_print " " "  [一加/OPPO] 使用分离的 init_boot 分区放置 ramdisk"
              block=boot
            else
              ui_print " " "  [一加/OPPO] 无 init_boot，ramdisk 随 boot"
              block=boot
            fi
            # OPPO/一加 avb 校验严格：保留 auto 让 AK3 自动判断
            patch_vbmeta_flag=auto
          else
            ui_print " " "  [通用] 非一加/OPPO 机型，按标准 GKI 流程处理"
          fi

          if [ -e "$INITBOOT_PART" ]; then
            ui_print " " "  [分区] init_boot 存在 → ramdisk 路径走 init_boot"
          fi

          # ==================== 刷入 ====================
          split_boot

          if [ -f "$SPLITIMG/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              # 无 ramdisk（部分一加/OPPO 机型 ramdisk 在 init_boot 或为空）
              ui_print " " "  [提示] boot 内无 ramdisk，执行整刷 boot"
              flash_boot
          fi

          ui_print " "
          ui_print "{{SOL}} {{KMI}} GKI  刷入完成"
          ui_print " "

          # ==================== 收尾校验 ====================
          # 若写入了 init_boot，提示用户后续可能需要 patch vbmeta
          if [ "$IS_OPLUS" = true ] && [ -e "$INITBOOT_PART" ]; then
            ui_print " " "  [一加/OPPO] 若开机卡 logo，请尝试 patch vbmeta / 关闭 avb 校验后再试"
          fi
          ui_print " "
          '''

          content = (tpl.replace("{{SOL}}", sol)
                         .replace("{{KMI}}", kmi)
                         .replace("{{KV}}", kv))

          # 去掉 python 三引号的公共缩进
          lines = content.split("\n")
          dedented = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in lines)
          if not dedented.endswith("\n"):
              dedented += "\n"
          with open("ak3/anykernel.sh", "w", encoding="utf-8", newline="\n") as f:
              f.write(dedented)
          print(dedented)
          PYEOF
          echo "--- 语法检查 ---"
          bash -n ak3/anykernel.sh && echo "OK: anykernel.sh 语法合法"

      # 上游 ksud 已加固 AnyKernel3 ZIP 校验（见 userspace/ksud/ANYKERNEL3.md）：
      #   * 必须恰好一个 META-INF/com/google/android/update-binary
      #   * 顶层只应有 anykernel.sh / tools/ 及合法条目
      #   * 拒绝模块 ZIP、重复条目、绝对路径与 ../ 穿越
      #   * 安装脚本 (update-binary) 体积上限 4 MiB
      # 所以打包后要做一次自检，避免生成"刷不进去"的包。
      - name: 放入 Image 并打包 AnyKernel3
        id: pack
        env:
          KMI_NAME: ${{ steps.kmi.outputs.kmi }}
          SOL_NAME: ${{ steps.sol.outputs.sol_name }}
        run: |
          KMI="$KMI_NAME"
          # 输出名用 ASCII 化后的方案名，避免中文/空格进入文件名
          ZIP="$(printf '%s' "$SOL_NAME" | tr -c 'A-Za-z0-9._-' '_')-${KMI}-GKI-AnyKernel3.zip"
          cp gki/arch/arm64/boot/Image ak3/Image
          # 清掉可能混进来的仓库元数据文件，保证顶层条目干净
          rm -f ak3/.gitignore ak3/.gitattributes ak3/README.md.bak 2>/dev/null || true
          cd ak3
          zip -r9 "../$ZIP" ./* -x '*.git*'
          cd ..
          ls -la "$ZIP"

          echo "--- AK3 ZIP 合规自检 ---"
          ENTRIES="$(unzip -Z1 "$ZIP")"
          echo "$ENTRIES" | head -40

          # 1) update-binary 恰好 1 个
          UBC="$(printf '%s\n' "$ENTRIES" | grep -c '^META-INF/com/google/android/update-binary$' || true)"
          echo "update-binary 数量: $UBC"
          [ "$UBC" = "1" ] || { echo "::error::update-binary 数量应为 1，实际 $UBC"; exit 1; }

          # 2) 顶层 anykernel.sh 必须存在
          printf '%s\n' "$ENTRIES" | grep -qx 'anykernel.sh' \
            || { echo "::error::缺少顶层 anykernel.sh"; exit 1; }

          # 3) 不允许重复条目
          DUPS="$(printf '%s\n' "$ENTRIES" | sort | uniq -d || true)"
          if [ -n "$DUPS" ]; then
            echo "::error::ZIP 内存在重复条目："; echo "$DUPS"; exit 1
          fi

          # 4) 不允许绝对路径或 ../ 穿越
          if printf '%s\n' "$ENTRIES" | grep -qE '^/|(^|/)\.\./'; then
            echo "::error::ZIP 内存在绝对路径或 ../ 穿越条目"; exit 1
          fi

          # 5) 不允许混入模块 ZIP
          if printf '%s\n' "$ENTRIES" | grep -qi '^module\.prop$'; then
            echo "::error::ZIP 顶层出现 module.prop（模块 ZIP 混入）"; exit 1
          fi

          # 6) 安装脚本体积 <= 4 MiB
          UB_SIZE="$(unzip -l "$ZIP" 'META-INF/com/google/android/update-binary' | awk 'NR>3{print $1}' | head -1)"
          echo "update-binary 大小: ${UB_SIZE:-0} bytes"
          if [ -n "$UB_SIZE" ] && [ "$UB_SIZE" -gt 4194304 ]; then
            echo "::error::update-binary 超过 4 MiB"; exit 1
          fi

          echo "OK: AK3 ZIP 通过合规自检"
          echo "zip_name=$ZIP" >> $GITHUB_OUTPUT
          echo "zip_path=$(pwd)/$ZIP" >> $GITHUB_OUTPUT

      - name: 获取最新 Manager（root 管理器）
        id: manager
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT_SOLUTION: ${{ inputs.root_solution }}
          MANAGER_REF: ${{ inputs.solution_ref }}
          PYTHON_BIN: python3
        run: |
          chmod +x scripts/fetch-manager.sh
          bash scripts/fetch-manager.sh
          echo "--- 拿到 ---"
          ls -la manager-artifacts/ || true

      - name: 校验 Manager 与内核版本对齐
        continue-on-error: true
        run: |
          echo "内核 commit 数 : $(grep -oE 'commit_count: [0-9]+' KSU_INFO.txt | head -1 | awk '{print $2}')"
          echo "内核版本算法   : ${{ steps.sol.outputs.sol_version_formula }}"
          echo "Manager versionCode: ${{ steps.manager.outputs.manager_version_code }}"
          M="${{ steps.manager.outputs.manager_version_code }}"
          if [ -n "$M" ] && [ "$M" != "0" ]; then
            echo "OK: 已拿到 Manager versionCode=$M"
            echo "   若管理器提示'需要更新内核'，把 solution_ref 固定到该 Manager 对应的 commit 即可对齐。"
          else
            echo "::warning::未取到 Manager versionCode（该方案未发布 APK 或来源不可用）"
          fi

      - name: 校验 Manager 签名与包名
        if: ${{ steps.manager.outputs.apk_path != '' }}
        continue-on-error: true
        env:
          APK: ${{ steps.manager.outputs.apk_path }}
          PKGS: ${{ steps.sol.outputs.mgr_pkgs }}
          SOL_NAME: ${{ steps.sol.outputs.sol_name }}
        run: |
          echo "==> Manager APK: $APK"
          echo "==> 方案: $SOL_NAME"
          echo "==> 已知包名集合: $PKGS"

          # 1) 打印包名 —— 上游计划把 Manager 从 FolkSU(me.yuki.folksu)
          #    改名为 moesu。签名证书不变。内核只按签名信任，所以包名/展示名
          #    变化不影响可用性，这里只做记录 + 白名单提示。
          if command -v aapt2 >/dev/null 2>&1 || [ -n "${ANDROID_HOME:-}" ]; then
            AAPT="$(command -v aapt2 || echo "${ANDROID_HOME:-}/build-tools/$(ls "${ANDROID_HOME:-}/build-tools" 2>/dev/null | sort -V | tail -1)/aapt2")"
            if [ -x "$AAPT" ]; then
              PKG="$("$AAPT" dump packagename "$APK" 2>/dev/null || true)"
              echo "包名: ${PKG:-<未能读取>}"
              if [ -z "$PKG" ]; then
                echo "::warning::未能读取包名（aapt2 不可用？）"
              elif printf '%s\n' "$PKGS" | tr ',' '\n' | grep -qx "$PKG"; then
                echo "OK: 包名在已知集合内"
              else
                echo "::warning::包名为 $PKG，不在已知集合（新版本可能又改名了）"
              fi
              APPNAME="$("$AAPT" dump badging "$APK" 2>/dev/null | sed -nE "s/^application-label:'(.*)'$/\1/p" | head -1 || true)"
              echo "展示名: ${APPNAME:-<未能读取>}"
            else
              echo "note: 未找到 aapt2，跳过包名检查"
            fi
          else
            echo "note: 无 Android SDK，跳过包名检查"
          fi

          # 2) 打印签名指纹（用于跨版本比对；签名不变则指纹应始终一致）
          if command -v keytool >/dev/null 2>&1; then
            echo "--- 签名证书（前 2 条）---"
            keytool -printcert -jarfile "$APK" 2>/dev/null \
              | grep -E "Owner:|SHA256:|SHA1:" | head -6 \
              || echo "note: keytool 读取失败"
          else
            echo "note: 无 keytool，跳过签名打印"
          fi
          echo "SHA256(apk) = $(sha256sum "$APK" | awk '{print $1}')"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sol.outputs.sol_name }}-GKI-${{ inputs.kmi }}-AnyKernel3
          path: ${{ steps.pack.outputs.zip_name }}

      - name: 上传 Manager
        if: ${{ steps.manager.outputs.apk_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sol.outputs.sol_name }}-Manager-${{ steps.manager.outputs.manager_version }}
          path: ${{ steps.manager.outputs.apk_path }}

      - name: 生成内核信息
        run: |
          {
            echo "# ${{ steps.sol.outputs.sol_name }} GKI Build"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| root 方案 | \`${{ inputs.root_solution }}\` (${{ steps.sol.outputs.sol_name }}) |"
            echo "| KMI | \`${{ inputs.kmi }}\` |"
            echo "| AOSP branch | \`${{ steps.kmi.outputs.branch }}\` |"
            echo "| 源码 ref | \`${{ inputs.solution_ref || steps.sol.outputs.sol_ref }}\` |"
            echo "| SUSFS | \`${{ inputs.enable_susfs }}\` |"
            echo "| Manager 版本 | \`${{ steps.manager.outputs.manager_version || '未获取' }}\` |"
            echo "| Manager versionCode | \`${{ steps.manager.outputs.manager_version_code || '-' }}\` |"
            echo ""
            echo "## 内核源码"
            echo '```'
            cat GKI_INFO.txt
            echo ""
            cat KSU_INFO.txt 2>/dev/null || true
            echo '```'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 创建 Release
        if: ${{ inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || format('{0}-{1}-{2}', inputs.root_solution, inputs.kmi, github.run_number) }}
          name: "${{ steps.sol.outputs.sol_name }} GKI ${{ inputs.kmi }}"
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.pack.outputs.zip_name }}
            ${{ steps.manager.outputs.apk_path }}
          fail_on_unmatched_files: false
          generate_release_notes: false
